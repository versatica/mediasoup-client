name: mediasoup-client-npm-publish

# Triggered by pushing a release tag (SEMVER, e.g. 3.20.8), which the `release`
# task in npm-scripts.mjs creates. It creates the GitHub release and publishes
# the NPM package via OIDC trusted publishing.
on:
  push:
    tags:
      # Node release tags only (SEMVER).
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  # Don't cancel an in-progress publish if a new run lands in the same group.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Ensure mediasoup-client version is not already published on NPM
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.version' package.json)
          published_version=$(npm view "mediasoup-client@${version}" version 2>/dev/null || true)
          if [ "${published_version}" = "${version}" ]; then
            echo "mediasoup-client@${version} is already published on NPM, this should not happen"
            exit 1
          fi

  # Create the GitHub release.
  release:
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" --title "${TAG}" --generate-notes

  # Publish the NPM package via OIDC trusted publishing.
  publish:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-26.04
    # The publish itself takes a few minutes. The rest of the budget is for the
    # "Wait for NPM availability" step below, which has its own deadline.
    timeout-minutes: 60
    permissions:
      # Allow requesting short-lived OIDC token used for NPM trusted publishing.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires a recent npm (>= 11.5.1).
      - name: Update npm
        run: npm install -g npm@latest

      - name: npm ci --ignore-scripts --foreground-scripts
        run: npm ci --ignore-scripts --foreground-scripts

      - name: npm publish
        run: npm publish

      # `npm publish` returns as soon as the registry accepts the tarball, but the
      # version is not installable until NPM finishes scanning it, which typically
      # takes around 5 minutes and may take 15 or more. See:
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      #
      # Everything chained to this workflow resolves the released version from NPM:
      #
      #   mediasoup-client-npm-publish
      #     - mediasoup-website-update (the website build reads the latest
      #       published version)
      #     - mediasoup-demo-update (runs `npm install mediasoup-client`)
      #
      # Both chains gate on this run's conclusion, so waiting here (rather than in
      # each of them) is what keeps all of them from running against a version that
      # NPM does not serve yet.
      #
      # If the deadline expires the run fails, which stops both chains. The package
      # is published at that point, so recovery is re-running
      # `mediasoup-website-update.yaml` and `mediasoup-demo-update.yaml` manually
      # (both accept `workflow_dispatch`) once NPM serves the version.
      - name: Wait for NPM availability
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.version' package.json)
          # Give up after 20 minutes. NPM documents the scan as "typically around
          # five minutes" and "up to 15 minutes or more" at peak times, explicitly
          # without any guarantee.
          deadline_seconds=1200
          # Time between two consecutive polls, doubling from 5 up to 60 seconds.
          poll_delay_seconds=5
          max_poll_delay_seconds=60
          # The registry is CDN fronted, so a single hit does not prove that every
          # edge already serves the version. Require two consecutive ones.
          hits=0
          while [ "${SECONDS}" -lt "${deadline_seconds}" ]; do
            published_version=$(npm view "mediasoup-client@${version}" version 2>/dev/null || true)
            if [ "${published_version}" = "${version}" ]; then
              hits=$(( hits + 1 ))
              if [ "${hits}" -ge 2 ]; then
                echo "mediasoup-client@${version} is available on NPM after ${SECONDS} seconds"
                exit 0
              fi
              echo "mediasoup-client@${version} seen on NPM, confirming in 10 seconds"
              sleep 10
              continue
            fi
            hits=0
            echo "mediasoup-client@${version} not available on NPM yet, retrying in ${poll_delay_seconds} seconds"
            sleep "${poll_delay_seconds}"
            if [ "${poll_delay_seconds}" -lt "${max_poll_delay_seconds}" ]; then
              poll_delay_seconds=$(( poll_delay_seconds * 2 ))
            fi
          done
          echo "mediasoup-client@${version} did not become available on NPM within ${deadline_seconds} seconds"
          exit 1
